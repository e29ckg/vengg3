services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: vengg_db
      MYSQL_USER: ${DB_USER:-vengg_app}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      TZ: Asia/Bangkok
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    profiles: [tools]
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Bangkok
      DB_HOST: db
      DB_NAME: vengg_db
      DB_USER: ${DB_USER:-vengg_app}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
    ports:
      - "127.0.0.1:89:80"
    volumes:
      - avatars:/var/www/html/vengg3/backend/public/uploads/avatars
      - google_credentials:/var/www/html/vengg3/backend/src/Config
      - document_templates:/var/www/html/vengg3/backend/storage/document-templates
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - backend

  cron-notifier:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Bangkok
      DB_HOST: db
      DB_NAME: vengg_db
      DB_USER: ${DB_USER:-vengg_app}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - google_credentials:/var/www/html/vengg3/backend/src/Config
    command: sh -c "while true; do php /var/www/html/vengg3/backend/cron/daily_notify.php; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  avatars:
  google_credentials:
  document_templates:
